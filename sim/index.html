<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>picorubykaigi01 LED matrix simulator</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; padding: 16px;
    font: 14px/1.5 ui-sans-serif, system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: #14161a; color: #d8dee9;
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.sub { margin: 0 0 16px; color: #8b95a5; font-size: 13px; }
  .wrap { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; }
  .panel-side { flex: 0 0 auto; }
  .code-side { flex: 1 1 380px; min-width: 320px; }
  canvas { background: #0a0b0d; border: 1px solid #2c313a; border-radius: 6px; display: block; }
  /* A box per set of buttons, with its name sitting on the top edge. */
  .group { position: relative; border: 1px solid #2c313a; border-radius: 6px;
           padding: 4px 12px 0; margin: 0 0 14px; }
  .group-title { position: absolute; top: -0.75em; left: 10px; padding: 0 6px;
                 background: #14161a; color: #8b95a5; font-size: 12px; }
  .controls { display: flex; gap: 10px; align-items: center; margin: 12px 0; flex-wrap: wrap; }
  button, select {
    font: inherit; padding: 6px 14px; border-radius: 4px;
    border: 1px solid #3b424e; background: #232833; color: #d8dee9; cursor: pointer;
  }
  button.disclosure { display: block; margin: 12px 0 0; padding: 0; border: none; background: none;
                      color: #8b95a5; font-size: 12px; }
  button.disclosure:hover { color: #d8dee9; }
  button.primary { background: #2f6feb; border-color: #2f6feb; color: #fff; font-weight: 600; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  textarea {
    width: 100%; box-sizing: border-box; height: 300px; resize: vertical;
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    background: #0f1116; color: #d8dee9; border: 1px solid #2c313a;
    border-radius: 6px; padding: 10px;
  }
  /* The code box in colour: a <pre> with the same text lies under the
     textarea, and the textarea's own text goes transparent once there are
     colours to show (class "colored", set from setCodeColors). Without them
     -- a PicoRuby.wasm that has no SyntaxHighlight -- it stays an ordinary
     textarea. Lines do not wrap, so that both lay the text out alike. */
  .editor { position: relative; }
  .editor textarea { display: block; position: relative; white-space: pre; overflow: auto; }
  #code-colors {
    position: absolute; inset: 0; margin: 0; box-sizing: border-box; overflow: hidden;
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre;
    padding: 10px; border: 1px solid transparent; border-radius: 6px;
    background: #0f1116; color: #d8dee9; pointer-events: none; display: none;
  }
  .editor.colored #code-colors { display: block; }
  .editor.colored textarea { background: transparent; color: transparent; caret-color: #d8dee9; }
  .editor.colored textarea::selection { background: rgba(88, 140, 230, .35); color: transparent; }
  /* One class per category of SyntaxHighlight.tokenize. 8 is method names,
     and to Ruby that includes operators and [ ], so it stays quiet. */
  .k1 { color: #ff7b72; }              /* keyword */
  .k2 { color: #a5d6ff; }              /* string */
  .k3 { color: #8b949e; }              /* comment. Not italic: a slanted face may be laid out wider than the textarea on top */
  .k4 { color: #79c0ff; }              /* number */
  .k5 { color: #7ee787; }              /* symbol */
  .k6 { color: #ffa657; }              /* constant */
  .k7 { color: #ffc2b8; }              /* @ivar $gvar */
  .k8 { color: #d9c9f5; }              /* method name */
  #status { margin-top: 10px; padding: 8px 10px; border-radius: 4px; min-height: 1.5em;
            font: 13px/1.5 ui-monospace, monospace; white-space: pre-wrap; }
  #status.ok    { background: #10261a; color: #7ee2a8; border: 1px solid #1d4630; }
  #status.error { background: #2a1416; color: #ff9a9a; border: 1px solid #5a2126; }
  #status.busy  { background: #1b2029; color: #8b95a5; border: 1px solid #2c313a; }
  label { color: #8b95a5; }
  .legend { color: #8b95a5; font-size: 12px; margin-top: 10px; }
  code { background: #1b2029; padding: 1px 5px; border-radius: 3px; }
  #notelog, #devicelog {
    margin: 4px 0 0; padding: 8px 10px; height: 150px; overflow-y: auto;
    background: #0f1116; border: 1px solid #2c313a; border-radius: 6px;
    font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; color: #9fb6d0;
  }
  .pad { display: flex; gap: 28px; align-items: center; margin: 14px 0 4px; }
  .dpad {
    display: grid; gap: 4px;
    grid-template-areas: ". up ." "left . right" ". down .";
  }
  .ab { display: flex; gap: 10px; }
  .btn {
    width: 44px; height: 44px; padding: 0; font-size: 16px;
    background: #232833; border: 1px solid #3b424e; color: #d8dee9;
    border-radius: 6px; cursor: pointer; user-select: none;
  }
  .btn.round { border-radius: 50%; }
  .leds { display: flex; gap: 8px; align-items: center; margin: 12px 0 0; }
  .led { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  .led.green { background: #4ade80; box-shadow: 0 0 8px #4ade8099; }
  .led.green.off { background: #1f2a22; box-shadow: none; }
  .led.red { background: #f87171; box-shadow: 0 0 8px #f8717199; }
  .leds .legend { margin-left: 4px; }
  .btn.held { background: #2f6feb; border-color: #2f6feb; color: #fff; }
</style>
</head>
<body>

<h1>PicoRubyKaigi01 Board Simulator</h1>
<p class="sub">
  PicoRubyKaigi01 基板のLEDマトリクス、ボタン、音声出力のシミュレータです。
</p>

<div id="app"></div>

<script>
// The coloured copy of the code box. Ruby works out the colours (Prism, inside
// the wasm) and hands over finished HTML; what is here is only what has to
// happen at once rather than on the next heartbeat: following the scroll.
(function () {
  let wired = false;
  window.setCodeColors = function (html) {
    const pre = document.getElementById('code-colors');
    const box = document.getElementById('code');
    if (!pre || !box) return;
    if (!wired) {
      wired = true;
      box.addEventListener('scroll', function () {
        pre.scrollTop = box.scrollTop;
        pre.scrollLeft = box.scrollLeft;
      });
      pre.parentElement.classList.add('colored');
    }
    pre.innerHTML = html;
    pre.scrollTop = box.scrollTop;
    pre.scrollLeft = box.scrollLeft;
  };
})();
</script>

<script>
// Painting is the one thing left to JavaScript: a frame is 256 values handed
// over in a single call, instead of several hundred property writes crossing
// the Ruby/JS boundary.
(function () {
  const CELL = 26, GAP = 2, PAD = 4;
  let canvas = null, ctx = null;

  // Looked up on each call until found, rather than once at load: Funicular
  // mounts the canvas after this script runs, so grabbing it here would find
  // nothing, throw, and leave renderPanel undefined. A missing JS function does
  // not raise on the Ruby side — it only logs — so that failure would be quiet.
  function context() {
    if (ctx) return ctx;
    canvas = document.getElementById('panel');
    if (!canvas) return null;
    ctx = canvas.getContext('2d', { willReadFrequently: true });
    return ctx;
  }

  // Two hex digits per dot, 512 characters. See Panel#levels_hex for why the
  // frame crosses the boundary as a string rather than an array.
  window.renderPanel = function (hex) {
    const ctx = context();
    if (!ctx) return;
    ctx.fillStyle = '#0a0b0d';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    for (let y = 0; y < 16; y++) {
      for (let x = 0; x < 16; x++) {
        const v = parseInt(hex.substr((y * 16 + x) * 2, 2), 16) || 0;
        const px = PAD + x * (CELL + GAP);
        const py = PAD + y * (CELL + GAP);
        // Off LEDs stay visible as a faint well so the grid reads as a panel.
        ctx.fillStyle = '#1a1d23';
        ctx.fillRect(px, py, CELL, CELL);
        if (v > 0) {
          const a = v / 255;
          ctx.fillStyle = 'rgba(255, 250, 235, ' + a.toFixed(3) + ')';
          ctx.fillRect(px, py, CELL, CELL);
          ctx.shadowColor = 'rgba(255, 245, 210, ' + (a * 0.9).toFixed(3) + ')';
          ctx.shadowBlur = 10 * a;
          ctx.fillRect(px, py, CELL, CELL);
          ctx.shadowBlur = 0;
        }
        // The seam between the two driver chips.
        if (y === 8) {
          ctx.fillStyle = '#3b424e';
          ctx.fillRect(0, py - GAP, canvas.width, 1);
        }
      }
    }
  };
})();
</script>

<script>
// The loader turns every <script type="text/ruby"> into its own mruby task, and
// tasks are scheduled cooperatively rather than run to completion in order. The
// three sources here depend on one another, so they are fetched and concatenated
// into a single inline script — one task, deterministic order.
//
// sim_panel.rb has to come first: it defines the I2C stand-in and tolerates the
// driver's `require 'i2c'`, which has no gem to resolve to in the browser.
(async function () {
  const status = document.getElementById('status');
  const M = '../mrbgems/';
  const SOURCES = [
    'sim_panel.rb',
    // picoruby-midibase and its MML front end are pure Ruby, so the real
    // parser, sequencer and router run here. Only the sound generator is
    // replaced: PSG is a C extension, WebAudio takes its place.
    M + 'picoruby-midibase/mrblib/midibase.rb',
    M + 'picoruby-midibase/mrblib/router.rb',
    M + 'picoruby-midibase/mrblib/parser.rb',
    M + 'picoruby-midibase/mrblib/clock.rb',
    M + 'picoruby-midibase/mrblib/session.rb',
    M + 'picoruby-midibase/mrblib/voice_allocator.rb',
    M + 'picoruby-midibase-mml/mrblib/clock.rb',
    M + 'picoruby-midibase-mml/mrblib/parser.rb',
    M + 'picoruby-midibase-mml/mrblib/sequence.rb',
    M + 'picoruby-midibase-mml/mrblib/player.rb',
    M + 'picoruby-is31fl3729/mrblib/is31fl3729.rb',
    // The board layer is a directory on the device and `require` pulls the
    // parts in; there is no filesystem here, so the page lists them itself,
    // ahead of the loader whose requires then find the classes already there.
    '../lib/picorubykaigi01/board.rb',
    '../lib/picorubykaigi01/led_matrix.rb',
    '../lib/picorubykaigi01/speaker.rb',
    '../lib/picorubykaigi01/status_led.rb',
    '../lib/picorubykaigi01/buttons.rb',
    '../lib/picorubykaigi01.rb',
    'sim_audio.rb',
    'sim_device.rb',
    'sim_app.rb'
  ];
  try {
    const texts = await Promise.all(SOURCES.map(async (path) => {
      // no-store, for the same reason the examples use it: a reload does not
      // clear the cache for fetches the page makes itself, and these change
      // constantly during development.
      const res = await fetch(path, { cache: 'no-store' });
      if (!res.ok) throw new Error(path + ': ' + res.status + ' ' + res.statusText);
      return await res.text();
    }));
    const ruby = document.createElement('script');
    ruby.type = 'text/ruby';
    ruby.textContent = texts.join("\n");
    document.body.appendChild(ruby);

    // A local build (rake sim:wasm) carries the drawing and font gems the stock
    // package leaves out. Without it the page still works, minus text.
    let loaderSrc = 'https://cdn.jsdelivr.net/npm/@picoruby/wasm-wasi@latest/dist/init.iife.js';
    try {
      // A plain GET rather than HEAD: the file is a few kilobytes and the
      // script tag below reads it from cache, while a HEAD for a URL that is
      // about to be loaded as a script gets reported as an aborted request.
      const local = await fetch('vendor/init.iife.js', { cache: 'no-cache' });
      if (local.ok) {
        loaderSrc = 'vendor/init.iife.js';
        // A static server sends no Cache-Control, so the browser keeps these by
        // its own rule of thumb -- and went on running the wasm from before a
        // `rake sim:wasm` (the code box stayed without colours: the old build
        // had no SyntaxHighlight). 'no-cache' asks the server whether the copy
        // is still good, a 304 when it is, and refreshes it when it is not, so
        // that the loader's own requests below find the new one.
        await Promise.all(['vendor/picoruby.js', 'vendor/picoruby.wasm'].map(
          (url) => fetch(url, { cache: 'no-cache' }).then((r) => r.arrayBuffer()).catch(() => null)));
      }
    } catch (e) { /* fall through to the CDN */ }

    const loader = document.createElement('script');
    loader.src = loaderSrc;
    loader.onerror = function () {
      status.className = 'error';
      status.textContent = 'PicoRuby.wasm を CDN から読み込めませんでした。ネットワークを確認してください。';
    };
    document.body.appendChild(loader);
  } catch (e) {
    status.className = 'error';
    status.textContent = 'ソースの読み込みに失敗しました: ' + e.message
      + "\nリポジトリルートをサーバのルートにして開いてください (rake sim:server)。";
  }
})();
</script>

</body>
</html>
