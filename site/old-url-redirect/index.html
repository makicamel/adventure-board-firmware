<script>
(function () {
  var rest = location.pathname.replace(/^\/adventure-board-firmware/, '');
  var to;
  if (/^\/console(\/|$)/.test(rest)) {
    to = 'https://picorubykaigi.org/adventure-board-console/' + rest.replace(/^\/console\/?/, '');
  } else {
    to = 'https://picorubykaigi.org/adventure-board' + (rest || '/');
  }
  location.replace(to + location.search + location.hash);
})();
</script>
