# The guide and the console are published by their own repositories,
# picorubykaigi/adventure-board and picorubykaigi/adventure-board-console:
# each has a workflow, started by hand, that calls build-guide.yml or
# build-console.yml here and deploys the result to its GitHub Pages
# (picorubykaigi.org/adventure-board/ and .../adventure-board-console/).
#
# This workflow does two smaller things:
#   - on every push to main, builds both, to show that they still build
#     (what they make stays inside Actions);
#   - started by hand with "GitHub Pages" ticked, publishes this repository's
#     own Pages (picorubykaigi.org/adventure-board-firmware/, where both
#     lived until 2026-10-26) as pages that send visitors on to the new
#     addresses. Source: site/old-url-redirect/. See site/README.md.
name: site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'sim/**'
      - 'lib/**'
      - 'examples/**'
      - 'mrbgems/picoruby-is31fl3729/**'
      - 'mrbgems/picoruby-midibase/**'
      - 'mrbgems/picoruby-midibase-mml/**'
      - 'mrbgems/picoruby-vram/**'
      - 'mrbgems/picoruby-shinonome/**'
      - 'mrbgems/picoruby-syntax-highlight/**'
      - 'build_config/picoruby-wasm.rb'
      - 'tasks/site.rake'
      - '.github/workflows/site.yml'
      - '.github/workflows/build-guide.yml'
      - '.github/workflows/build-console.yml'
  workflow_dispatch:
    inputs:
      github_pages:
        description: 'GitHub Pages にも出す（古い URL から新しい URL へ送るページ）'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  guide:
    uses: ./.github/workflows/build-guide.yml
    with:
      ref: ${{ github.sha }}
      artifact: guide

  console:
    uses: ./.github/workflows/build-console.yml
    with:
      ref: ${{ github.sha }}
      artifact: console

  redirect:
    if: github.event_name == 'workflow_dispatch' && inputs.github_pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/old-url-redirect

  deploy:
    needs: redirect
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
